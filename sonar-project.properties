# === Identificación del proyecto ===
sonar.projectKey=clausulas_paragrafos_crud
sonar.projectName=clausulas_paragrafos_crud
sonar.projectVersion=0.0.1

# === Directorios del código fuente y de pruebas ===
sonar.sources=src
sonar.tests=src,test
sonar.test.inclusions=**/*.spec.ts,**/*.e2e-spec.ts,**/*.integration-spec.ts,test/support/**

# === Cobertura (generada por pnpm run test:cov) ===
sonar.javascript.lcov.reportPaths=coverage/lcov.info

# === Exclusiones (archivos o carpetas que no se analizan) ===
sonar.exclusions=**/node_modules/**,**/*.spec.ts,**/*.e2e-spec.ts,**/*.integration-spec.ts,test/support/**,dist/**,coverage/**,swagger/**

# === Lenguaje y codificación ===
sonar.sourceEncoding=UTF-8
